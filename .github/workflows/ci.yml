# Intégration continue du frontend :
# - à chaque pull request et push sur main : build de production ;
# - sur main : image Docker (nginx + application) publiée sur ghcr.io.
name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build de production
        run: npx ng build --configuration production

  image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gestion-voyage-web:latest
            ghcr.io/${{ github.repository_owner }}/gestion-voyage-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

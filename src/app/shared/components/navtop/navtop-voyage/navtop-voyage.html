<mat-toolbar color="primary" class="navtop-container">
  <span class="spacer"></span>

  <div *ngIf="isLoggedIn; else loginButton" class="user-section">
    <button mat-button [matMenuTriggerFor]="userMenu" class="user-profile-button">
      <div class="user-avatar">
        <img *ngIf="userAvatar" [src]="userAvatar" [alt]="userName" class="avatar-image">
        <div *ngIf="!userAvatar" class="avatar-initials">{{ userInitials }}</div>
      </div>
      <span class="user-name">{{ userName }}</span>
      <mat-icon>arrow_drop_down</mat-icon>
    </button>

    <mat-menu #userMenu="matMenu" class="user-menu">
      <div class="user-info-header" mat-menu-item disabled>
        <div class="user-details">
          <div class="name">{{ userName }}</div>
          <div class="email">{{ userEmail }}</div>
        </div>
      </div>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="navigateToVoyages()">
        <mat-icon>flight</mat-icon>
        <span>Mes Voyages</span>
      </button>

      <button mat-menu-item (click)="navigateToReservations()">
        <mat-icon>event_seat</mat-icon>
        <span>Mes Réservations</span>
      </button>

      <mat-divider></mat-divider>

      <button mat-menu-item (click)="logout()" class="logout-item">
        <mat-icon>logout</mat-icon>
        <span>Déconnexion</span>
      </button>
    </mat-menu>
  </div>

  <ng-template #loginButton>
    <button mat-button routerLink="/login">
      <mat-icon>login</mat-icon>
      Login
    </button>
  </ng-template>
</mat-toolbar>
